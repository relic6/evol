[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "evol-kit"
dynamic = ["version"]
description = "EVOL — Growth infrastructure for AI software (reference Python implementation)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "EVOL Authors" }]
keywords = ["ai", "agent", "evolution", "llm", "growth", "framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "pydantic>=2.5,<3",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13",
  "portalocker>=2.8",
  "anthropic>=0.40",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
tokenizer = ["tiktoken>=0.5"]
scheduler = ["croniter>=2.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.12",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
evol = "evol.cli.main:main"

[project.urls]
"Source"        = "https://github.com/your-org/evol-py"
"Documentation" = "https://github.com/your-org/evol-py#readme"

[tool.hatch.version]
path = "src/evol/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evol"]

# ─────────── ruff ───────────

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "PL",       # pylint
  "RUF",      # ruff-specific
]
ignore = [
  "PLR0913",  # too many arguments to function call
  "PLR2004",  # magic value comparison
  "E501",     # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────── mypy ───────────

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/evol"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["portalocker.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true

# ─────────── pytest ───────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: integration tests",
  "conformance: conformance test suite",
  "slow: slow tests (skip in normal runs)",
]

[tool.coverage.run]
branch = true
source = ["src/evol"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
